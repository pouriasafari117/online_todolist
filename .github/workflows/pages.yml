name: Publish Pages
on:
  push:
    branches: ['**']
    paths-ignore: ['data/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site and record the deployed branch
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p _site
          cp index.html app.js core.js styles.css _site/
          python3 -c 'import json, os; open("_site/runtime-config.js", "w").write("window.ROOZANEH_BRANCH = " + json.dumps(os.environ["DEPLOY_BRANCH"], ensure_ascii=True) + ";\n")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
